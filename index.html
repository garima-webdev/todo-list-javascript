<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>
            To do list
        </title>
    </head>
    <body>
        <h1>
            My to do list
        </h1>
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button id="addBtn">Add task</button>
        <ul id="taskList"></ul>
        <button id="allBtn">All</button><br>
        <button id="activeBtn">Active</button><br>
        <button id="completedBtn">Completed task</button><br>
        <button id="clearBtn">Clear Completed</button>
        <script src="script.js"></script>
    </body>
</html>
